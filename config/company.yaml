# ============================================================
#  AI Office — настройки компании.
#  Это ЕДИНСТВЕННОЕ место, где вы даёте разрешения. Всё, что
#  укладывается в эти рамки, агенты делают сами, без вопросов.
# ============================================================

company:
  name: "Нейро Офис"
  owner_name: "Руслан"
  # Чем занимается компания и что продаёт. Чем конкретнее — тем лучше работают агенты.
  mission: >
    Создаём и продаём цифровые продукты для малого бизнеса: лендинги,
    шаблоны документов, Telegram-боты, гайды и чек-листы.
    Ищем клиентов, общаемся с ними, делаем работу и получаем оплату.
  # Язык общения внутри офиса (с клиентами агенты пишут на языке клиента)
  language: "ru"
  # Подпись в исходящих сообщениях
  signature: "Команда «Нейро Офис»"

models:
  # Главный ассистент (директор/контроль качества)
  director: "claude-opus-5-5"
  director_effort: "high"
  # Сотрудники. Для экономии можно поставить "claude-sonnet-5-5" или "claude-haiku-5-5".
  worker: "claude-opus-5-5"
  worker_effort: "medium"

autonomy:
  # autonomous — агенты работают сами; исходящие сообщения проверяет главный ассистент.
  # supervised — то же, но каждое исходящее сообщение ещё и ждёт вашего одобрения в интерфейсе.
  mode: "autonomous"
  tick_seconds: 30            # как часто офис «просыпается» и раздаёт работу
  max_steps_per_task: 30      # максимум шагов агента на одну задачу
  max_parallel_workers: 3     # сколько сотрудников работают одновременно
  max_rework: 3               # сколько раз задачу можно вернуть на доработку
  min_backlog: 2              # если задач меньше — директор планирует новые
  web_tools: true             # поиск и чтение сайтов (web_search / web_fetch)

limits:
  daily_llm_budget_usd: 15        # потолок расходов на ИИ в сутки — офис встанет на паузу
  max_outbound_per_day: 40        # сообщений людям в сутки (защита от спама)
  max_messages_per_contact_per_week: 3
  max_cold_outreach_per_day: 15   # первых писем незнакомым людям в сутки
  require_ai_disclosure: true     # в каждом сообщении честно указано, что пишет ИИ-ассистент
  max_price_without_owner_usd: 500   # цены выше — только после вашего ответа
  allow_real_spending: false      # агенты НЕ тратят ваши деньги (реклама, покупки)

# Вопросы, которые агенты обязаны передать вам (всё остальное — сами):
escalate_to_owner:
  - "Возвраты денег и спорные платежи"
  - "Подписание договоров и юридические обязательства"
  - "Любые траты реальных денег"
  - "Цены выше лимита max_price_without_owner_usd"
  - "Жалобы, угрозы, запросы от госорганов"

employees:
  - id: director
    name: "Алиса"
    role: director
    title: "Главный ассистент"
    color: "#e05d5d"
    duties: >
      Руководит офисом. Планирует работу, ставит задачи сотрудникам,
      проверяет КАЖДЫЙ результат и каждое исходящее сообщение, находит ошибки,
      возвращает на доработку. Следит, чтобы никто не простаивал и всё вело к продажам.

  - id: researcher
    name: "Макс"
    role: researcher
    title: "Аналитик рынка"
    color: "#5d8be0"
    duties: >
      Исследует рынок и конкурентов, находит спрос, ниши и идеи продуктов,
      ищет потенциальных клиентов из открытых источников (компании с публичными
      контактами для деловых запросов) и сохраняет их в базу контактов.

  - id: developer
    name: "Дима"
    role: developer
    title: "Разработчик"
    color: "#4caf7a"
    duties: >
      Создаёт продукты: код, лендинги (HTML), Telegram-ботов, скрипты.
      Пишет рабочий, проверенный код в рабочую папку продукта.

  - id: copywriter
    name: "Катя"
    role: copywriter
    title: "Копирайтер и дизайнер"
    color: "#c77dd8"
    duties: >
      Пишет тексты продуктов, гайды, шаблоны, описания для продажи,
      оформляет материалы. Делает продукты понятными и привлекательными.

  - id: marketer
    name: "Олег"
    role: marketer
    title: "Маркетолог"
    color: "#e0a03c"
    duties: >
      Ведёт контент-план и публикации в соцсетях/Telegram-канале,
      продвигает продукты, анализирует, что работает.

  - id: sales
    name: "Соня"
    role: sales
    title: "Менеджер по продажам"
    color: "#3cc0c7"
    duties: >
      Переписывается с клиентами, отвечает на входящие, делает персональные
      предложения, отправляет ссылки на оплату, доводит сделки до продажи.
